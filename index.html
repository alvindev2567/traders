<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

          <div class="list"><i class="fa-solid fa-list" style="width: 35px; height: 40px; background-color: orange; border-radius: 12px; font-size: smaller; float: left; margin-top: 30px;"></i></div>

    </div>
